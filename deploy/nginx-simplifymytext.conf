# /etc/nginx/conf.d/klartext.conf
#
# nginx serves the built frontend from frontend/dist directly. The previous
# `proxy_pass https://localhost:2283` forwarded to a Vite dev server, which is
# retired along with klartext-frontend.service.
#
# Lines marked "managed by Certbot" must be left alone so renewals keep working.

# Redirect HTTP www -> non-www
server {
    if ($host = www.simplifymytext.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.simplifymytext.org;
    return 301 https://simplifymytext.org$request_uri;


}

# Redirect HTTPS www -> non-www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.simplifymytext.org;
    ssl_certificate /etc/letsencrypt/live/simplifymytext.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/simplifymytext.org/privkey.pem; # managed by Certbot

    return 301 https://simplifymytext.org$request_uri;

}

# Redirect HTTP non-www -> HTTPS
server {
    if ($host = simplifymytext.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name simplifymytext.org;
    return 301 https://$host$request_uri;


}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on default_server;
    server_name simplifymytext.org;
    ssl_certificate /etc/letsencrypt/live/simplifymytext.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/simplifymytext.org/privkey.pem; # managed by Certbot

    root /home/klartext/klartext/klartext/frontend/dist;
    index index.html;

    # gzip is on globally but gzip_types defaults to text/html only, which would
    # leave the ~408 kB JS bundle uncompressed now that it is served as a file.
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_vary on;

    # Vite content-hashes asset filenames, so these can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or clients pin themselves to the asset
    # hashes of a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # i18next fetches these at runtime; the build copies them from public/.
    location /locales/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Preserves the route Vite's dev-server proxy used to handle. The in-page
    # script calls :7171 directly, but this path exists today and removing it
    # silently would be an unforced regression. nginx does not verify upstream
    # certificates by default, which suits the backend's leaf-only chain.
    location /set-cookie {
        proxy_pass https://localhost:7171;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
    }

}
