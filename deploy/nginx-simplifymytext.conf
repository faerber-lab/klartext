# Reference for the simplifymytext.org vhost.
#
# MERGE these location blocks into the existing server block in
# /etc/nginx/sites-available/ — do not overwrite the file. The listen / ssl_*
# lines and the port 80 redirects are managed by Certbot and must be left alone.
#
# This replaces the old `location / { proxy_pass https://localhost:2283; }`,
# which forwarded to a Vite dev server. nginx now serves the built assets
# directly and the frontend service is gone.

server {
    server_name simplifymytext.org;

    # listen 443 ssl;                                  # managed by Certbot
    # ssl_certificate     /etc/letsencrypt/live/simplifymytext.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/simplifymytext.org/privkey.pem;

    root /home/klartext/klartext/klartext/frontend/dist;
    index index.html;

    # Asset filenames are content-hashed by Vite, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or clients pin themselves to the asset
    # hashes of a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # i18next fetches these at runtime; they are copied from public/ into dist/.
    location /locales/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Preserves the path Vite's server.proxy used to handle. The in-page script
    # calls :7171 directly, but this route exists today and removing it silently
    # would be an unforced regression. nginx does not verify upstream
    # certificates by default, which suits the backend's leaf-only chain.
    location /set-cookie {
        proxy_pass https://localhost:7171;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
    }
}
